<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CubeOS</title>
<style>
:root{--bg:#000;--panel:#0d0b09;--panel2:#16120e;--line:#2a2119;--or:#ff7a1a;--or2:#ffa24d;--tx:#f4ece4;--mut:#9a8d80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:99999}
#loader svg{width:96px;height:96px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,#2a1405,#000 60%)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.card svg{display:block;margin:0 auto 10px;width:84px;height:84px}
.card h1{margin:0;text-align:center;font-size:24px;letter-spacing:.5px}
.card p{margin:4px 0 18px;text-align:center;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;color:var(--mut)}
.tabs button.on{border-color:var(--or);color:var(--or)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=email]{width:100%;padding:11px;background:#000;border:1px solid var(--line);border-radius:8px}
input:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.go{width:100%;margin-top:18px;padding:12px;background:var(--or);color:#000;font-weight:700;border:0;border-radius:8px;cursor:pointer}
.go:hover{background:var(--or2)}
.small{margin-top:14px;text-align:center;font-size:13px;color:var(--mut)}
.err{margin-top:10px;text-align:center;font-size:13px;color:#ff6b6b}
#desk{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 80% 90%,#2b1203,transparent 50%),#050403}
#area{flex:1;position:relative;overflow:hidden}
.icons{position:absolute;inset:14px auto auto 14px;display:grid;gap:10px;grid-template-columns:repeat(2,84px)}
.ic{width:84px;padding:8px 2px;text-align:center;background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer;font-size:12px}
.ic:hover{background:#ff7a1a18;border-color:#ff7a1a55}
.ic b{display:block;font-size:30px;line-height:1.2;font-weight:400}
.win{position:absolute;width:min(480px,94%);background:var(--panel);border:1px solid var(--or);border-radius:10px;box-shadow:0 18px 50px #000c;display:flex;flex-direction:column;max-height:92%}
.win header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;cursor:grab;touch-action:none;user-select:none}
.win header span{flex:1;font-weight:700}
.win header button{width:24px;height:24px;border:0;border-radius:50%;background:#2a2119;cursor:pointer;line-height:1}
.win header button:hover{background:var(--or);color:#000}
.body{padding:14px;overflow:auto}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#000;border-top:1px solid var(--or)}
#bar .start{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#bar .start svg{width:24px;height:24px}
#tasks{flex:1;display:flex;gap:6px;overflow:auto}
#tasks button{padding:4px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:nowrap}
#tasks button.on{border-color:var(--or)}
#clock{color:var(--mut);font-size:13px}
#menu{position:absolute;left:10px;bottom:8px;width:230px;background:var(--panel);border:1px solid var(--or);border-radius:10px;padding:8px;z-index:9999}
#menu button{display:block;width:100%;text-align:left;padding:9px 10px;background:transparent;border:0;border-radius:6px;cursor:pointer}
#menu button:hover{background:#ff7a1a22}
.chat{display:grid;grid-template-columns:130px 1fr;gap:12px;min-height:240px}
.list button{display:block;width:100%;text-align:left;padding:8px;background:transparent;border:0;border-radius:6px;color:var(--mut);cursor:pointer}
.list button.on{background:#ff7a1a22;color:var(--tx)}
.msgs{display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.m{max-width:80%;padding:7px 10px;border-radius:10px;background:var(--panel2)}
.m.me{align-self:flex-end;background:var(--or);color:#000}
.send{display:flex;gap:6px;margin-top:8px}.send input{flex:1}
.send button{padding:0 14px;background:var(--or);border:0;border-radius:8px;color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.g{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center}
.g b{display:block;font-size:28px;font-weight:400}.g small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:42px;height:22px;border-radius:11px;background:#2a2119;position:relative;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.15s}
.sw.on{background:var(--or)}.sw.on::after{left:23px;background:#000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{padding:10px;border:1px solid var(--line);border-radius:8px;text-align:center}.stats b{display:block;font-size:22px;color:var(--or)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:400}
td button{padding:3px 9px;border:1px solid var(--or);background:transparent;color:var(--or);border-radius:6px;cursor:pointer}
.av{width:64px;height:64px;border-radius:10px;background:var(--panel2);border:2px solid var(--or);display:grid;place-items:center;font-size:32px}
@media(max-width:560px){.chat{grid-template-columns:1fr}.win{left:3%!important}}
.app{display:grid;grid-template-columns:170px 1fr;height:350px}
.sb{background:#0a0806;border-right:1px solid var(--line);padding:10px;overflow:auto}
.sb h4{margin:10px 6px 6px;font-size:12px;font-weight:400;color:var(--mut)}
.ch{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--mut)}
.ch:hover{color:var(--tx)}.ch.on{background:linear-gradient(90deg,#ff7a1a33,transparent);color:var(--tx);box-shadow:inset 3px 0 var(--or)}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.top{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}.top span{color:var(--mut);font-size:13px}
.feed{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.mg{display:flex;gap:10px;align-items:flex-start}.mg.me{flex-direction:row-reverse}.mg.me>div{text-align:right}
.mg small{color:var(--mut)}.bb{display:inline-block;margin-top:3px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;text-align:left}
.mg.me .bb{background:linear-gradient(135deg,var(--or2),var(--or));color:#000;border:0;border-radius:14px 4px 14px 14px}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.compose input{flex:1;padding:10px;background:#000;border:1px solid var(--line);border-radius:20px}
.compose button{padding:0 18px;border:0;border-radius:20px;background:var(--or);color:#000;font-weight:700;cursor:pointer}
.av2{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#000;background:linear-gradient(135deg,var(--or2),var(--or));position:relative;flex:none}
.dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:#3ddc84;border:2px solid var(--panel)}.dot.off{background:#5a5048}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:16px 10px 0;background:radial-gradient(circle at 50% 100%,#ff7a1a30,transparent 70%)}
.pod div{width:90px;text-align:center;border-radius:10px 10px 0 0;padding:8px 4px;background:linear-gradient(#ff7a1a55,#ff7a1a10);border:1px solid #ff7a1a66;border-bottom:0}
.pod b{display:block;font-size:22px}.pod small{color:var(--mut)}
.gc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.gc .ban{height:64px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#ff7a1a,#3a1500)}
.gc div.in{padding:10px}.gc small{color:var(--mut);display:block;margin-bottom:8px}
.gc button,.pill,.tag{border:0;border-radius:20px;padding:4px 12px;background:var(--or);color:#000;font-weight:700;font-size:12px;cursor:pointer}
.pill.g{background:#3ddc8433;color:#3ddc84}.pill.r{background:#ff4d4d33;color:#ff6b6b}.tag{background:#ff7a1a22;color:var(--or2);font-weight:400;cursor:default}
.rl{display:flex;gap:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.rl i{font-style:normal;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:#ff7a1a22;flex:none}.rl small{color:var(--mut)}
.ban2{height:90px;background:linear-gradient(120deg,#ff7a1a,#4a1c00 60%,#000)}
.prof{padding:0 18px 18px;margin-top:-34px}.prof .av{width:72px;height:72px;font-size:36px;background:#000}
.bar{height:8px;border-radius:4px;background:#2a2119;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2))}
.sw2{display:flex;gap:10px;margin-top:8px}.sw2 button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.fr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.fr:hover{background:#ff7a1a12}.fr span:nth-child(2){flex:1}.fr small{color:var(--mut)}
.path{padding:10px 14px;background:#0a0806;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px}
.cht{display:flex;align-items:flex-end;gap:6px;height:70px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}.cht i{flex:1;background:linear-gradient(var(--or2),var(--or));border-radius:3px 3px 0 0;opacity:.85}
@media(max-width:560px){.app{grid-template-columns:1fr;height:auto}.sb{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.sb h4{display:none}}
.ic svg{width:34px;height:34px;color:var(--or)}.win header svg{width:16px;height:16px;vertical-align:-3px;color:var(--or)}#menu svg{width:18px;height:18px;vertical-align:-4px;margin-right:10px;color:var(--or)}#tasks svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px;color:var(--or)}
.gc .ban svg{width:34px;height:34px;color:var(--tx)}.fr span:first-child svg{width:18px;height:18px;color:var(--or)}
.term{background:#000;color:var(--or2);font:13px/1.6 'Courier New',monospace;padding:14px;height:250px;overflow:auto}.tin{display:flex;gap:8px;padding:10px 14px;background:#000;border-top:1px solid var(--line);color:var(--or);font-family:monospace}.tin input{flex:1;background:transparent;border:0;color:var(--tx);font:inherit}
.spin{transform-origin:200px 110px;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.rl b.n{font-family:monospace;color:var(--or)}
.muted{color:var(--mut)}
</style>
</head>
<body>

<div id="loader" class="hide"><svg viewBox="0 0 100 100"><g fill="#000" stroke="#ff7a1a" stroke-width="6" stroke-linejoin="round"><path d="M50 7 89 28.500V71.500L50 93 11 71.500V28.500Z"/><path d="M50 50 11 28.500M50 50 89 28.500M50 50V93"/></g></svg></div>

<section id="login">
  <div class="card">
    <svg viewBox="0 0 100 100" aria-label="Logo CubeOS"><g fill="#000" stroke="#ff7a1a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M50 7 89 28.500V71.500L50 93 11 71.500V28.500Z"/><path d="M50 50 11 28.500M50 50 89 28.500M50 50V93"/></g></svg>
    <h1>CubeOS</h1>
    <p id="loginsub">Terminal de acesso restrito</p>
    <div class="tabs"><button id="tp" class="on">Usuário</button><button id="ts">Staff</button></div>
    <div id="playerForm">
      <label for="u">Nick do Minecraft</label><input id="u" type="text" autocomplete="username">
      <label for="p">Senha</label><input id="p" type="password" autocomplete="current-password">
      <div id="regExtra" class="hide">
        <label for="reason">Motivo do pedido</label><input id="reason" type="text">
        <label for="invite">Código de convite (opcional)</label><input id="invite" type="text">
      </div>
      <button class="go" id="enter">Entrar</button>
      <div class="small"><a href="#" id="toggleReg" style="color:var(--or)">Não tem conta? Solicitar acesso</a></div>
    </div>
    <div id="staffForm" class="hide">
      <label for="su">Usuário</label><input id="su" type="text">
      <label for="sp">Senha</label><input id="sp" type="password">
      <label for="sk">Código da equipe</label><input id="sk" type="password">
      <button class="go" id="senter">Entrar como staff</button>
    </div>
    <div class="err" id="err"></div>
    <div class="small" id="hint">Acesso concedido apenas a quem foi convidado.</div>
  </div>
</section>

<section id="desk" class="hide">
  <div id="area">
    <div class="icons" id="icons"></div>
  </div>
  <div id="menu" class="hide"></div>
  <nav id="bar">
    <button class="start" id="start"><svg viewBox="0 0 100 100"><g fill="#000" stroke="#ff7a1a" stroke-width="6" stroke-linejoin="round"><path d="M50 7 89 28.500V71.500L50 93 11 71.500V28.500Z"/><path d="M50 50 11 28.500M50 50 89 28.500M50 50V93"/></g></svg>Menu</button>
    <div id="tasks"></div><span id="clock"></span>
  </nav>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
